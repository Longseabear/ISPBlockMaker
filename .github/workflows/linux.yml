name: Linux server
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.16.0', '24']
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build:linux
      - run: node --test tests/linux-runtime.test.mjs tests/app-updates.test.mjs tests/shared-terminals.test.mjs tests/terminal-skill-contract.test.mjs tests/workspace-search.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: linux-server-node-${{ matrix.node }}
          path: |
            release/*-linux.tar.gz
            release/*-linux.tar.gz.sha256
